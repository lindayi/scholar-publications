name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*')
          exit $status

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the bundled script parses
        run: node --check assets/js/app.js
